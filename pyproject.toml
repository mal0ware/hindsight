[project]
name = "hindsight"
version = "0.1.0"
description = "How much of a regime-switching backtest is the model, and how much is knowing the future?"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "matplotlib==3.11.2",
    "numba==0.68.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "N803", # matrix arguments are upper case, as in the papers
    "N806", # the same for local matrices
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["numba.*", "pandas.*", "scipy.*", "statsmodels.*", "matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"
